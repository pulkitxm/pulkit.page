name: CI
on:
  merge_group: null
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Content
            command: check:content
          - name: Layouts
            command: check:layouts
          - name: Comments
            command: check:comments
          - name: Repository
            command: check:repository
          - name: Formatting
            command: format:check
          - name: Lint
            command: lint
          - name: Tests
            command: test
          - name: Dead code
            command: check:dead-code
          - name: Em dashes
            command: check:em-dashes
          - name: Imports
            command: check:imports
          - name: Shell syntax
            command: check:shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run check
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: bun run "$CHECK_COMMAND"
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-site
          path: dist
          include-hidden-files: true
          retention-days: 1
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name ==
          'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  site:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Site links
            command: check:site
          - name: SEO
            command: check:seo
          - name: HTML
            command: check:html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-site
          path: dist
      - name: Validate built site
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: bun run "$CHECK_COMMAND"
  workflows:
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: 1.27.x
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: zizmor
      - run: zizmor --persona=pedantic --min-severity=high --format=plain .github/workflows
  secrets:
    name: Secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: 1.27.x
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
  audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: shellcheck
      - run: shellcheck scripts/*.sh .githooks/pre-commit
  browser:
    name: Browser smoke
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-site
          path: dist
      - run: bunx playwright install --with-deps chromium
      - run: bun run browser:check
  ci:
    name: CI
    if: always()
    needs:
      - quality
      - workflows
      - workflow-security
      - build
      - site
      - secrets
      - audit
      - shellcheck
      - browser
    runs-on: ubuntu-26.04
    steps:
      - name: Require every check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "every required check passed"
  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name ==
      'workflow_dispatch')
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
