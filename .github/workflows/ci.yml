name: CI
on:
  merge_group: null
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run ci
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-sites
          path: apps/*/dist
          include-hidden-files: true
          retention-days: 1
  workflows:
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: 1.27.x
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: zizmor
      - run: zizmor --persona=pedantic --min-severity=high --format=plain .github/workflows
  secrets:
    name: Secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: 1.27.x
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
  audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: shellcheck
      - run: shellcheck tooling/checks/install-hooks.sh .githooks/pre-commit
  browser:
    name: Browser smoke
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-sites
          path: apps
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/engine
      - run: bunx turbo run check:browser --only
  ci:
    name: CI
    if: always()
    needs:
      - verify
      - workflows
      - workflow-security
      - secrets
      - audit
      - shellcheck
      - browser
    runs-on: ubuntu-26.04
    steps:
      - name: Require every check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "every required check passed"
  deploy:
    name: Deploy ${{ matrix.app }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref ==
      'refs/heads/main') || (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: page
            project: VERCEL_PROJECT_ID_PAGE
          - app: blog
            project: VERCEL_PROJECT_ID_BLOG
    environment:
      name: ${{ github.event_name == 'pull_request' && format('{0}-preview', matrix.app) || matrix.app }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-sites
          path: apps
      - id: deploy
        env:
          APP: ${{ matrix.app }}
          PRODUCTION: ${{ github.event_name != 'pull_request' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars[matrix.project] }}
        run: >
          target=preview

          if [ "$PRODUCTION" = "true" ]; then
            target=production
          fi

          url=$(bunx vercel@59.23.2 deploy "apps/$APP/dist" --yes --target "$target" --token
          "$VERCEL_TOKEN")

          echo "url=$url" >> "$GITHUB_OUTPUT"

          echo "Deployed $APP to $url" >> "$GITHUB_STEP_SUMMARY"
