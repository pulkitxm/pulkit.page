name: CI
on:
  merge_group: null
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .turbo/cache
            apps/*/.cache/generate
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun run ci
      - name: Prune week-old Turbo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-sites
          path: apps/*/dist
          include-hidden-files: true
          retention-days: 1
  workflows:
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: 1.27.x
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: zizmor
      - run: zizmor --persona=pedantic --min-severity=high --format=plain .github/workflows
  secrets:
    name: Secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: 1.27.x
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
  audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908
        with:
          tool: shellcheck
      - run: shellcheck tooling/checks/install-hooks.sh .githooks/pre-commit
  browser:
    name: Browser smoke (${{ matrix.viewport }} ${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - desktop
          - mobile
        shard:
          - 1/2
          - 2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-sites
          path: apps
      - name: Run browser check
        env:
          BROWSER_VIEWPORT: ${{ matrix.viewport }}
          BROWSER_SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_CHANNEL: chrome
        run: bunx turbo run check:browser --only
  ci:
    name: CI
    if: always()
    needs:
      - verify
      - workflows
      - workflow-security
      - secrets
      - audit
      - shellcheck
      - browser
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "every required check passed"
