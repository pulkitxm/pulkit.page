<!doctype html>
<html lang="en" class="scheme-light-dark data-[theme=dark]:scheme-dark data-[theme=light]:scheme-light">
  {{ > head }}
  <body class="m-0 bg-bg font-sans text-base/relaxed text-fg antialiased **:box-border **:focus-visible:outline-2 **:focus-visible:outline-offset-4 **:focus-visible:outline-fg">
    <a class="absolute -top-25 left-4 bg-bg px-2 py-1 text-inherit focus:top-2" href="#main">Skip to content</a>
    <div class="mx-auto max-w-170 px-6 max-sm:px-4">
      {{ > header }}
      <main id="main" class="min-h-[60vh] pt-14 pb-20 max-sm:pt-8">
        <article>
          <header class="mb-10 [&>p]:m-0 [&>p]:font-mono [&>p]:text-xs">
            <h1 class="mt-0 mb-4 w-fit text-[clamp(28px,5vw,36px)] font-semibold leading-tight tracking-tight text-balance" data-title>
              {{ heading }}
            </h1>
            <a class="mb-3 flex w-fit items-center gap-2.5 text-sm text-inherit no-underline decoration-line underline-offset-3 hover:underline" href="{{ authorUrl }}"><img class="m-0 size-7 rounded-full object-cover" src="/assets/content/pulkit-portrait.webp" alt="" width="28" height="28" />{{ author }}</a>
            {{ date }}
          </header>
          <div class="text-[17px]/[1.75] wrap-anywhere">{{ content }}</div>
        </article>
        {{ related }}
      </main>
      {{ > footer }}
    </div>
  </body>
</html>
