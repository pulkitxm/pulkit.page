<footer
  class="flex items-center justify-between gap-4 border-t border-line py-6 font-mono text-xs text-muted max-sm:flex-col max-sm:items-start"
>
  <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
    <small class="text-inherit">{{ copyright }}</small><span>{{ social }}</span>
  </div>
  <div class="flex items-center gap-4">
    <a
      class="text-inherit decoration-muted underline-offset-4 hover:text-fg hover:decoration-current"
      href="{{ markdown }}"
      type="text/markdown"
      >View as Markdown</a
    ><button
      class="cursor-pointer rounded-md border border-line bg-transparent px-2.5 py-1 text-inherit [font:inherit] hover:text-fg"
      type="button"
      data-theme-toggle
      aria-label="Switch color theme"
    >
      Theme
    </button>
  </div>
</footer>
