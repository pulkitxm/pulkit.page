<!doctype html>
<html lang="en" data-page-transitions class="scheme-light-dark data-[theme=dark]:scheme-dark data-[theme=light]:scheme-light" data-layout="article">
  {{ > head }}
  <body class="m-0 bg-bg font-sans text-base/relaxed text-fg antialiased **:box-border **:focus-visible:outline-2 **:focus-visible:outline-offset-5 **:focus-visible:outline-fg">
    <div aria-hidden="true" data-progress></div>
    {{ > header }}
    <main id="main" data-main>
      <header data-page-head data-grid>
        <div data-margin>
          {{ breadcrumbs }}
          <a class="text-inherit no-underline" href="/about/" data-author><img src="/assets/content/pulkit-portrait-56.webp" alt="" width="28" height="28" />{{ author }}</a>
          <div data-meta>{{ date }}</div>
        </div>
        <div data-head-main>
          <h1 class="m-0" data-title>{{ heading }}</h1>
          <p class="m-0" data-lead>{{ description }}</p>
        </div>
      </header>
      <div data-grid>
        <div class="wrap-break-word" data-prose>{{ content }}</div>
        <div data-related>{{ related }}</div>
      </div>
    </main>
    {{ > footer }}
  </body>
</html>
