<!doctype html>
<html lang="en" data-page-transitions class="scheme-light-dark data-[theme=dark]:scheme-dark data-[theme=light]:scheme-light" data-layout="home">
  {{ > head }}
  <body class="m-0 bg-bg font-sans text-base/relaxed text-fg antialiased **:box-border **:focus-visible:outline-2 **:focus-visible:outline-offset-5 **:focus-visible:outline-fg">
    {{ > header }}
    <main id="main" data-main>
      <section data-hero data-grid>
        <div aria-hidden="true" data-scene="home"></div>
        <p class="m-0" data-label data-hero-meta><span>Software engineer</span><span>India</span><span>Open to projects</span></p>
        <h1 class="m-0" data-title data-display>{{ heading }}</h1>
        <p class="m-0" data-statement>{{ description }}</p>
      </section>
      <div data-home>{{ content }}</div>
    </main>
    {{ > footer }}
  </body>
</html>
