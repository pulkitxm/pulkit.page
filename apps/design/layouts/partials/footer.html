<footer class="relative overflow-hidden px-8 pt-32 pb-8 max-sm:px-5 max-sm:pt-20" data-footer>
  <div class="mx-auto flex max-w-300 flex-col gap-16">
    <a class="group flex flex-wrap items-center justify-between gap-8 text-inherit no-underline" href="/contact/" data-cursor="talk" data-footer-cta>
      <span class="block text-[clamp(56px,11vw,184px)] font-bold leading-[0.9] tracking-tight" data-split="chars">Let's talk.</span>
      <span class="grid size-[clamp(96px,12vw,168px)] shrink-0 place-items-center rounded-full bg-fg text-bg" data-magnetic data-strength="0.5" aria-hidden="true">
        <svg aria-hidden="true" class="size-1/3 transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] group-hover:-rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"></path></svg>
      </span>
    </a>
    <div class="grid grid-cols-[2fr_1fr_1fr] gap-10 border-t border-line pt-10 text-sm max-md:grid-cols-1" data-footer-grid>
      <p class="m-0 max-w-90 text-muted">Designed and built by hand in India. Every page here is Markdown, rendered by a small static site generator.</p>
      <nav class="flex flex-col gap-2" aria-label="Footer navigation" data-footer-links>
        {{ navigation }}
      </nav>
      <div class="flex flex-col gap-2" data-footer-links>{{ social }}</div>
    </div>
    <div class="flex flex-wrap items-center justify-between gap-4 font-mono text-2xs uppercase tracking-[0.12em] text-muted">
      <small class="text-inherit">{{ copyright }}</small>
      <a class="text-inherit decoration-muted underline-offset-4 hover:decoration-current" href="{{ markdown }}" type="text/markdown">View as Markdown</a>
      <a class="text-inherit no-underline" href="#main" data-to-top>Back to top ↑</a>
    </div>
  </div>
  <p class="pointer-events-none m-0 mt-10 text-center text-[24.5vw] font-bold leading-[0.78] tracking-[-0.04em] select-none" aria-hidden="true" data-colossal>Pulkit</p>
</footer>
<div class="pointer-events-none fixed inset-0 z-50 max-[64rem]:hidden" aria-hidden="true" data-cursor-layer>
  <div data-cursor-dot></div>
  <div data-cursor-ring><span data-cursor-label></span></div>
</div>
