<footer data-footer>

      <p class="m-0">Projects, questions, or just hello. I usually reply within a day.</p>

    <nav aria-label="Footer navigation" data-footer-nav>{{ navigation }}</nav>

    <small data-label>{{ copyright }}</small>
    <a class="text-inherit" href="{{ markdown }}" type="text/markdown" data-label>View as Markdown</a>
    <a class="text-inherit" href="#main" data-label>Back to top</a>
  </div>
  <p class="m-0" aria-hidden="true" data-closing>Pulkit</p>
