<a class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:rounded-md focus:bg-fg focus:px-4 focus:py-2 focus:text-bg" href="#main">Skip to content</a>
<header data-header data-grid>
  <a class="text-inherit no-underline" href="/" aria-label="Pulkit, home" data-brand>{{ brand }}</a>
  <nav aria-label="Main navigation" data-nav>
    {{ navigation }}
  </nav>
  <div data-actions>
    <p class="m-0" data-status><span aria-hidden="true" data-dot></span><time data-clock>IST</time></p>
    <button class="cursor-pointer" type="button" data-theme-toggle aria-label="Switch color theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" data-theme-icon>
        <mask id="theme-icon-mask">
          <rect width="24" height="24" fill="#fff"></rect>
          <circle cx="24" cy="4" r="8" fill="#000" data-theme-bite></circle>
        </mask>
        <circle cx="12" cy="12" r="5" fill="currentColor" mask="url(#theme-icon-mask)" data-theme-core></circle>
        <g stroke="currentColor" stroke-width="2" stroke-linecap="round" data-theme-rays>
          <path d="M12 1.5v2.25M12 20.25v2.25M1.5 12h2.25M20.25 12h2.25M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path>
        </g>
      </svg>
    </button>
    <button class="cursor-pointer" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-toggle>
      <span>Menu</span>
      <span aria-hidden="true" data-burger><span></span><span></span></span>
    </button>
  </div>
</header>
<dialog class="m-0 max-h-none max-w-none border-0 p-0" id="site-menu" aria-label="Site menu" data-menu>
  <div data-menu-panel>
    <nav aria-label="Menu navigation" data-menu-links>
      {{ navigation }}
      <a href="/guestbook/">Guestbook</a>
      <a href="/claude-directory/">Claude Directory</a>
    </nav>
    <p class="m-0" data-menu-social>{{ social }}</p>
  </div>
</dialog>
