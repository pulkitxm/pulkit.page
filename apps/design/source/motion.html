<script>
"use strict";
(() => {
  const { gsap, ScrollTrigger } = globalThis;
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const fine = matchMedia("(hover: hover) and (pointer: fine)");
  const engine = typeof gsap !== "undefined" && typeof ScrollTrigger !== "undefined";
  let paused = reduced.matches;
  try {
    paused = paused || localStorage.getItem("design-motion") === "off";
  } catch {}
  let media;
  let galleryTrigger;
  let transitionActive = false;
  const sculptureState = { rotation: 0, scroll: 0, morph: 0, pointerX: 0, pointerY: 0 };
  if (engine) {
    gsap.registerPlugin(ScrollTrigger);
  }
  const motionButton = $("#motion-toggle");
  function syncMotionLabel() {
    document.documentElement.classList.toggle("no-motion", paused);
    motionButton.setAttribute("aria-pressed", String(paused));
    motionButton.textContent = paused ? "Motion off" : "Motion on";
  }
  syncMotionLabel();
  const activeNav = document.body.dataset.page === "case" ? "work" : document.body.dataset.page;
  const nav = $(`[data-nav="${activeNav}"]`);
  if (nav) {
    nav.setAttribute("aria-current", "page");
  }
  function updateProgress() {
    const range = document.documentElement.scrollHeight - innerHeight;
    $(".progress").style.transform = `scaleX(${range > 0 ? scrollY / range : 0})`;
  }
  addEventListener("scroll", updateProgress, { passive: true });
  addEventListener("resize", updateProgress, { passive: true });
  function buildMotion() {
    media?.revert();
    galleryTrigger = null;
    $(".work-window")?.classList.remove("horizontal-work");
    $(".motion-stage")?.classList.remove("is-pinned");
    $(".detail-stage")?.classList.remove("is-pinned");
    if (!engine || paused) {
      return;
    }
    media = gsap.matchMedia();
    media.add({ desktop: "(min-width: 1000px)", mobile: "(max-width: 999px)" }, (context) => {
      const { desktop } = context.conditions;
      if ($(".hero")) {
        if (desktop) {
          gsap.set(".hero-chapter", { display: "block", autoAlpha: 0, y: 80 });
          const hero = gsap.timeline({
            scrollTrigger: {
              trigger: ".hero",
              start: "top top",
              end: "+=125%",
              pin: true,
              scrub: 1,
              anticipatePin: 1,
            },
          });
          hero
            .to(".hero-title .line:first-child", { xPercent: -65, opacity: 0, duration: 1 }, 0)
            .to(".hero-title .line:last-child", { xPercent: 70, opacity: 0, duration: 1 }, 0)
            .to(".hero-bottom,.hero-top", { opacity: 0, duration: 0.5 }, 0)
            .to(".sculpture-wrap", { x: "-18vw", y: "-2vh", scale: 1.2, duration: 1.5 }, 0)
            .to(sculptureState, { scroll: 2, morph: 1, duration: 2 }, 0)
            .to(".hero-chapter", { autoAlpha: 1, y: 0, duration: 0.8 }, 0.9)
            .to(".hero-meter i", { scaleX: 1, duration: 2 }, 0);
        } else {
          gsap.to(".sculpture-wrap", {
            y: 100,
            rotation: 25,
            ease: "none",
            scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: 1 },
          });
          gsap.to(sculptureState, {
            morph: 0.7,
            scroll: 1.5,
            scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: 1 },
          });
        }
      }
      if ($(".motion-stage")) {
        if (desktop) {
          $(".motion-stage").classList.add("is-pinned");
          gsap.set(".stage-final", { autoAlpha: 0, y: 80 });
          const stage = gsap.timeline({
            scrollTrigger: {
              trigger: ".motion-stage",
              start: "top top",
              end: "+=240%",
              pin: true,
              scrub: 1,
              anticipatePin: 1,
            },
          });
          stage
            .from(".stage-card", { yPercent: 150, rotation: 35, stagger: 0.18, duration: 1.1 }, 0)
            .to(".stage-title", { xPercent: -35, autoAlpha: 0, duration: 0.9 }, 0.7)
            .to(".card-think", { xPercent: 70, rotation: -12, duration: 0.8 }, 1.2)
            .to(".card-make", { xPercent: 25, rotation: 0, duration: 0.8 }, 1.2)
            .to(".card-feel", { xPercent: -20, rotation: 12, duration: 0.8 }, 1.2)
            .to(".thinking-rings", { rotation: 180, duration: 2 }, 0)
            .to(".making-bars i", { scaleY: 0.4, stagger: 0.1, duration: 0.8, yoyo: true, repeat: 1 }, 0.4)
            .to(".feeling-star", { rotation: 140, duration: 2.5 }, 0)
            .to(".stage-card", { yPercent: -180, xPercent: -20, rotation: -20, stagger: 0.16, duration: 1.2 }, 2.2)
            .to(".stage-final", { autoAlpha: 1, y: 0, duration: 1 }, 2.8)
            .to(".stage-progress i", { scaleX: 1, duration: 3.9 }, 0);
        } else {
          for (const [index, card] of $$(".stage-card").entries()) {
            gsap.from(card, {
              y: 80,
              rotation: index % 2 ? -12 : 12,
              scale: 0.88,
              scrollTrigger: { trigger: card, start: "top 95%", end: "top 30%", scrub: 0.7 },
            });
          }
        }
      }
      if ($(".work-window") && desktop) {
        const windowElement = $(".work-window");
        windowElement.classList.add("horizontal-work");
        const rail = $(".work-rail");
        const distance = () => rail.scrollWidth - windowElement.clientWidth;
        const tween = gsap.to(rail, {
          x: () => -distance(),
          ease: "none",
          scrollTrigger: {
            trigger: windowElement,
            start: "top 7%",
            end: () => `+=${distance()}`,
            pin: true,
            scrub: 0.8,
            invalidateOnRefresh: true,
            anticipatePin: 1,
            onUpdate: (self) => {
              const index = Math.round(self.progress * 2);
              $("#gallery-index").textContent = String(index + 1).padStart(2, "0");
              $(".gallery-progress i").style.transform = `scaleX(${(1 + self.progress * 2) / 3})`;
              for (const [i, button] of $$("[data-slide]").entries()) {
                button.setAttribute("aria-pressed", String(i === index));
              }
            },
          },
        });
        galleryTrigger = tween.scrollTrigger;
      }
      for (const frame of $$(".index-project-art")) {
        gsap.from($(".project-visual", frame), {
          scale: 1.17,
          yPercent: 8,
          ease: "none",
          scrollTrigger: { trigger: frame, start: "top bottom", end: "bottom top", scrub: 0.8 },
        });
      }
      if ($(".case-cover")) {
        gsap.from(".case-cover .project-visual", {
          scale: 1.22,
          yPercent: 8,
          scrollTrigger: {
            trigger: ".case-cover",
            start: "top bottom",
            end: "bottom top",
            scrub: 1,
          },
        });
      }
      if ($(".detail-stage") && desktop) {
        $(".detail-stage").classList.add("is-pinned");
        gsap
          .timeline({
            scrollTrigger: {
              trigger: ".detail-stage",
              start: "top top",
              end: "+=130%",
              scrub: 1,
              pin: true,
            },
          })
          .to(".detail-art .project-visual", { scale: 1.65, xPercent: 8, rotation: 4, ease: "none", duration: 2 }, 0)
          .to(".detail-art .small-sticker,.detail-art .floating-command,.detail-art .editorial-card", { y: -90, rotation: -8, duration: 2 }, 0);
      }
      for (const item of $$(".principle,.case-story h2,.about-story h2,.case-quote h2,.experience>a")) {
        gsap.from(item, {
          y: 50,
          opacity: 0.15,
          duration: 0.9,
          ease: "power3.out",
          scrollTrigger: {
            trigger: item,
            start: "top 91%",
            toggleActions: "play none none reverse",
          },
        });
      }
      if ($(".portrait-wrap")) {
        gsap.from(".portrait-wrap", {
          clipPath: "inset(20% 15% 20% 15%)",
          rotation: 5,
          scrollTrigger: {
            trigger: ".portrait-wrap",
            start: "top 90%",
            end: "center 50%",
            scrub: 1,
          },
        });
        gsap.to(".portrait-wrap img", {
          scale: 1.12,
          scrollTrigger: {
            trigger: ".portrait-wrap",
            start: "top bottom",
            end: "bottom top",
            scrub: 1,
          },
        });
      }
      if ($(".color-swatch")) {
        gsap.from(".color-swatch", {
          scaleY: 0.2,
          transformOrigin: "bottom",
          stagger: 0.12,
          scrollTrigger: {
            trigger: ".color-palette",
            start: "top 85%",
            end: "bottom 65%",
            scrub: 1,
          },
        });
      }
      for (const heading of $$(".word-reveal")) {
        if (!heading.dataset.split) {
          const walk = document.createTreeWalker(heading, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walk.nextNode()) {
            nodes.push(walk.currentNode);
          }
          for (const node of nodes) {
            const fragment = document.createDocumentFragment();
            for (const word of node.textContent.split(/(\s+)/)) {
              if (word.trim()) {
                const span = document.createElement("span");
                span.className = "reveal-word";
                span.textContent = word;
                fragment.append(span);
              } else {
                fragment.append(document.createTextNode(word));
              }
            }
            node.replaceWith(fragment);
          }
          heading.dataset.split = "true";
        }
        gsap.fromTo(
          $$(".reveal-word", heading),
          { opacity: 0.17 },
          {
            opacity: 1,
            stagger: 0.12,
            scrollTrigger: { trigger: heading, start: "top 85%", end: "bottom 45%", scrub: 0.6 },
          },
        );
      }
      for (const section of $$(".contact-band")) {
        gsap.from($(".big-contact", section), {
          y: 70,
          scrollTrigger: { trigger: section, start: "top bottom", end: "top 30%", scrub: 1 },
        });
      }
      return () => {
        $(".work-window")?.classList.remove("horizontal-work");
        $(".motion-stage")?.classList.remove("is-pinned");
        $(".detail-stage")?.classList.remove("is-pinned");
      };
    });
    ScrollTrigger.refresh();
  }
  function goToSlide(index, smooth = true) {
    if (galleryTrigger) {
      window.scrollTo({
        top: galleryTrigger.start + ((galleryTrigger.end - galleryTrigger.start) * index) / 2,
        behavior: smooth && !paused ? "smooth" : "instant",
      });
    } else {
      $$(".project")[index]?.scrollIntoView({
        behavior: paused ? "instant" : "smooth",
        block: "center",
      });
    }
  }
  for (const button of $$("[data-slide]")) {
    button.addEventListener("click", () => goToSlide(Number(button.dataset.slide)));
  }
  for (const [index, project] of $$(".project").entries()) {
    project.addEventListener("focusin", () => {
      if (galleryTrigger) {
        goToSlide(index, false);
      }
    });
  }
  motionButton.addEventListener("click", () => {
    paused = !paused;
    try {
      localStorage.setItem("design-motion", paused ? "off" : "on");
    } catch {}
    syncMotionLabel();
    buildMotion();
    updateProgress();
  });
  reduced.addEventListener("change", () => {
    paused = reduced.matches;
    syncMotionLabel();
    buildMotion();
  });
  let toastTimer;
  function toast(message) {
    $(".toast").textContent = message;
    $(".toast").classList.add("visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $(".toast").classList.remove("visible"), 2500);
  }
  $(".copy-email")?.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText("me@pulkit.page");
      toast("Email copied. Say hello whenever you like.");
    } catch {
      toast("Write to me@pulkit.page");
    }
  });
  if ($("#local-time")) {
    const updateTime = () => {
      $("#local-time").textContent = `${new Intl.DateTimeFormat("en", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date())} IST`;
    };
    updateTime();
    setInterval(updateTime, 60000);
  }
  const pointer = {
    x: innerWidth / 2,
    y: innerHeight / 2,
    active: false,
    project: false,
    scale: 1,
  };
  const ring = { x: pointer.x, y: pointer.y };
  const trail = Array.from({ length: 10 }, () => ({ x: pointer.x, y: pointer.y }));
  let pointerTime = 0;
  addEventListener(
    "pointermove",
    (event) => {
      if (!fine.matches || paused) {
        return;
      }
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      pointer.active = true;
      pointer.project = Boolean(event.target.closest(".project-frame,.index-project"));
      pointer.scale = event.target.closest("a,button") ? 1.8 : 1;
      pointerTime = performance.now();
    },
    { passive: true },
  );
  document.addEventListener("pointerleave", () => {
    pointer.active = false;
  });
  for (const frame of $$(".project-frame,.index-project-art")) {
    const art = $(".project-visual", frame);
    frame.addEventListener("pointermove", (event) => {
      if (!fine.matches || paused || !engine) {
        return;
      }
      const rect = frame.getBoundingClientRect();
      gsap.to(art, {
        rotationY: ((event.clientX - rect.left - rect.width / 2) / rect.width) * 7,
        rotationX: (-(event.clientY - rect.top - rect.height / 2) / rect.height) * 7,
        transformPerspective: 1400,
        duration: 0.6,
        overwrite: "auto",
      });
    });
    frame.addEventListener("pointerleave", () => {
      if (engine) {
        gsap.to(art, { rotationX: 0, rotationY: 0, duration: 0.8 });
      }
    });
  }
  for (const element of $$(".circle,.brand-star,.index-arrow")) {
    element.parentElement.addEventListener("pointermove", (event) => {
      if (!fine.matches || paused || !engine) {
        return;
      }
      const rect = element.parentElement.getBoundingClientRect();
      gsap.to(element, {
        x: (event.clientX - rect.left - rect.width / 2) * 0.12,
        y: (event.clientY - rect.top - rect.height / 2) * 0.2,
        rotation: 15,
        duration: 0.4,
      });
    });
    element.parentElement.addEventListener("pointerleave", () => {
      if (engine) {
        gsap.to(element, { x: 0, y: 0, rotation: 0, ease: "elastic.out(1,.4)", duration: 0.8 });
      }
    });
  }
  function animatePointer() {
    requestAnimationFrame(animatePointer);
    if (paused || !fine.matches || document.hidden) {
      return;
    }
    ring.x += (pointer.x - ring.x) * 0.2;
    ring.y += (pointer.y - ring.y) * 0.2;
    $(".pointer-ring").style.cssText = `opacity:${pointer.active && !pointer.project ? 0.7 : 0};transform:translate(${ring.x - 14}px,${ring.y - 14}px) scale(${pointer.scale})`;
    $(".project-cursor").style.cssText = `opacity:${pointer.active && pointer.project ? 1 : 0};transform:translate(${ring.x - 45}px,${ring.y - 45}px) scale(${pointer.project ? 1 : 0.3})`;
    let previous = pointer;
    for (const point of trail) {
      point.x += (previous.x - point.x) * 0.38;
      point.y += (previous.y - point.y) * 0.38;
      previous = point;
    }
    $(".pointer-trail path").setAttribute("d", `M${trail.map((point) => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" L")}`);
    $(".pointer-trail").style.opacity = pointer.active && performance.now() - pointerTime < 150 ? ".25" : "0";
  }
  requestAnimationFrame(animatePointer);
  function resetTransition() {
    transitionActive = false;
    if (engine) {
      gsap.set(".page-transition", { autoAlpha: 0 });
    }
  }
  let arriving;
  try {
    arriving = sessionStorage.getItem("design-arriving");
    sessionStorage.removeItem("design-arriving");
  } catch {}
  if (engine && !paused && arriving) {
    $("#transition-name").textContent = arriving;
    gsap.set(".page-transition", { autoAlpha: 1 });
    gsap.set(".transition-front,.transition-back", { yPercent: 0, y: 0 });
    gsap.timeline({ onComplete: resetTransition }).to(".transition-front", { yPercent: -100, duration: 0.75, ease: "power4.inOut", delay: 0.1 }).to(".transition-back", { yPercent: -100, duration: 0.7, ease: "power4.inOut" }, 0.15);
  }
  document.addEventListener("click", (event) => {
    const link = event.target.closest("a[href]");
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.target || link.hasAttribute("download")) {
      return;
    }
    const url = new URL(link.href, location.href);
    if (url.origin !== location.origin || !url.pathname.endsWith(".html") || (url.pathname === location.pathname && url.hash) || !engine || paused) {
      return;
    }
    if (url.pathname === location.pathname && !url.hash) {
      return;
    }
    event.preventDefault();
    if (transitionActive) {
      return;
    }
    transitionActive = true;
    const name = link.dataset.label || link.textContent.trim();
    $("#transition-name").textContent = name;
    try {
      sessionStorage.setItem("design-arriving", name);
    } catch {}
    gsap.set(".page-transition", { autoAlpha: 1 });
    gsap.set(".transition-front,.transition-back", { yPercent: 100, y: 0 });
    gsap
      .timeline({ onComplete: () => location.assign(url.href) })
      .to(".transition-back", { yPercent: 0, duration: 0.6, ease: "power4.inOut" }, 0)
      .to(".transition-front", { yPercent: 0, duration: 0.65, ease: "power4.inOut" }, 0.08)
      .fromTo(".transition-star", { rotation: -90, scale: 0.5 }, { rotation: 0, scale: 1, duration: 0.65 }, 0.1);
  });
  addEventListener("pageshow", (event) => {
    if (event.persisted) {
      resetTransition();
      if (engine) {
        ScrollTrigger.refresh();
      }
    }
  });
  function initializeSculpture() {
    const canvas = $("#sculpture");
    if (!canvas) {
      return;
    }
    const context = canvas.getContext("2d");
    if (!context) {
      return;
    }
    let size = 0;
    let visible = true;
    let last = 0;
    let targetX = 0;
    let targetY = 0;
    const segments = 160;
    const sides = 24;
    const vertices = [];
    const normalize = (vector) => {
      const length = Math.hypot(...vector) || 1;
      return vector.map((value) => value / length);
    };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const knot = (t) => {
      const radius = 1.7 + 0.6 * Math.cos(3 * t);
      return [radius * Math.cos(2 * t), radius * Math.sin(2 * t), 0.78 * Math.sin(3 * t)];
    };
    for (let i = 0; i < segments; i++) {
      const t = (i / segments) * Math.PI * 2;
      const center = knot(t);
      const tangent = normalize(knot(t + 0.001).map((value, axis) => value - center[axis]));
      const normal = normalize(cross(tangent, [0, 0, 1]));
      const binormal = cross(tangent, normal);
      for (let j = 0; j < sides; j++) {
        const angle = (j / sides) * Math.PI * 2;
        const offset = normal.map((value, axis) => 0.39 * (Math.cos(angle) * value + Math.sin(angle) * binormal[axis]));
        const ringNormal = [Math.cos(t) * Math.cos(angle), Math.sin(t) * Math.cos(angle), Math.sin(angle)];
        vertices.push({
          point: center.map((value, axis) => value + offset[axis]),
          normal: normalize(offset),
          ring: [(1.85 + 0.39 * Math.cos(angle)) * Math.cos(t), (1.85 + 0.39 * Math.cos(angle)) * Math.sin(t), 0.39 * Math.sin(angle)],
          ringNormal,
        });
      }
    }
    function rotate(point, rx, ry, rz) {
      const [x, y, z] = point;
      const y1 = y * Math.cos(rx) - z * Math.sin(rx);
      const z1 = y * Math.sin(rx) + z * Math.cos(rx);
      const x2 = x * Math.cos(ry) + z1 * Math.sin(ry);
      const z2 = -x * Math.sin(ry) + z1 * Math.cos(ry);
      return [x2 * Math.cos(rz) - y1 * Math.sin(rz), x2 * Math.sin(rz) + y1 * Math.cos(rz), z2];
    }
    function draw() {
      if (!size) {
        return;
      }
      const rx = 0.4 + sculptureState.pointerY * 0.35;
      const ry = -0.35 + sculptureState.pointerX * 0.45 + sculptureState.scroll * 0.3;
      const rz = -0.3 + sculptureState.rotation + sculptureState.scroll * 0.5;
      const morph = sculptureState.morph;
      const transformed = vertices.map((vertex) => {
        const point = rotate(
          vertex.point.map((value, axis) => value * (1 - morph) + vertex.ring[axis] * morph),
          rx,
          ry,
          rz,
        );
        const normal = rotate(normalize(vertex.normal.map((value, axis) => value * (1 - morph) + vertex.ringNormal[axis] * morph)), rx, ry, rz);
        const perspective = 8 / (8 - point[2]);
        return {
          x: size / 2 + point[0] * size * 0.162 * perspective,
          y: size / 2 + point[1] * size * 0.162 * perspective,
          z: point[2],
          normal,
        };
      });
      const faces = [];
      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < sides; j++) {
          const points = [transformed[i * sides + j], transformed[((i + 1) % segments) * sides + j], transformed[((i + 1) % segments) * sides + ((j + 1) % sides)], transformed[i * sides + ((j + 1) % sides)]];
          const normal = normalize(points.reduce((value, point) => value.map((number, axis) => number + point.normal[axis]), [0, 0, 0]));
          const light = Math.max(0, normal[0] * -0.4 + normal[1] * -0.55 + normal[2] * 0.7);
          const shine = Math.max(0, normal[0] * -0.25 + normal[1] * -0.5 + normal[2] * 0.82) ** 18;
          const brightness = 0.56 + light * 0.47;
          faces.push({
            points,
            z: points.reduce((sum, point) => sum + point.z, 0) / 4,
            color: `rgb(${Math.min(255, 245 * brightness + shine * 35)},${Math.min(200, 68 * brightness + shine * 95)},${Math.min(160, 24 * brightness + shine * 55)})`,
          });
        }
      }
      faces.sort((a, b) => a.z - b.z);
      context.clearRect(0, 0, size, size);
      for (const { points, color } of faces) {
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        for (const point of points.slice(1)) {
          context.lineTo(point.x, point.y);
        }
        context.closePath();
        context.fillStyle = color;
        context.strokeStyle = color;
        context.lineWidth = 0.65;
        context.fill();
        context.stroke();
      }
    }
    function resize() {
      size = canvas.clientWidth;
      const density = Math.min(devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(size * density);
      canvas.height = Math.round(size * density);
      context.setTransform(density, 0, 0, density, 0, 0);
      draw();
    }
    new ResizeObserver(resize).observe(canvas);
    new IntersectionObserver(
      ([entry]) => {
        visible = entry.isIntersecting;
      },
      { rootMargin: "100px" },
    ).observe(canvas);
    $(".hero").addEventListener("pointermove", (event) => {
      if (!fine.matches || paused) {
        return;
      }
      const rect = canvas.getBoundingClientRect();
      targetX = (event.clientX - rect.left) / rect.width - 0.5;
      targetY = (event.clientY - rect.top) / rect.height - 0.5;
    });
    $(".hero").addEventListener("pointerleave", () => {
      targetX = 0;
      targetY = 0;
    });
    function render(time) {
      requestAnimationFrame(render);
      if (paused || document.hidden || !visible || time - last < 32) {
        return;
      }
      const delta = Math.min(time - last, 64);
      last = time;
      sculptureState.rotation += delta * 0.00008;
      sculptureState.pointerX += (targetX - sculptureState.pointerX) * 0.06;
      sculptureState.pointerY += (targetY - sculptureState.pointerY) * 0.06;
      draw();
    }
    resize();
    requestAnimationFrame(render);
  }
  initializeSculpture();
  document.fonts.ready.then(() => {
    buildMotion();
    if (engine && !paused && !arriving) {
      gsap.from(".hero-title .line>span,.page-intro h1,.case-title h1,.contact-page h1", {
        y: 65,
        opacity: 0,
        duration: 1.1,
        stagger: 0.12,
        ease: "power4.out",
      });
      if ($(".hero .sculpture-wrap")) {
        gsap.from(".hero .sculpture-wrap", { opacity: 0, duration: 1.4 });
      }
    }
    updateProgress();
  });
})();
</script>
