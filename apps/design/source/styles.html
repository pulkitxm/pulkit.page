<style>
@font-face {
  font-family: "Space Grotesk";
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url(assets/font-0.ttf) format("truetype");
}
@font-face {
  font-family: "Instrument Serif";
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url(assets/font-1.ttf) format("truetype");
}
@font-face {
  font-family: "Instrument Serif";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(assets/font-2.ttf) format("truetype");
}

.project-visual {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  transition: filter 0.4s;
}
.project-frame:hover .project-visual {
  filter: saturate(1.15);
}
.frame-label {
  position: absolute;
  top: 25px;
  left: 27px;
  z-index: 5;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.frame-open {
  position: absolute;
  right: 23px;
  bottom: 23px;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  background: var(--paper);
  color: var(--ink);
  border-radius: 50%;
  font-size: 22px;
  z-index: 6;
  transition: transform 0.35s;
}
.project-frame:hover .frame-open {
  transform: rotate(45deg);
}
.frame-caption {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  padding-top: 13px;
  gap: 20px;
}
.kaksha-art {
  background: #c7d5ad;
  display: flex;
  align-items: center;
  justify-content: center;
}
.kaksha-art::before {
  content: "कक्षा";
  position: absolute;
  font-size: clamp(100px, 20vw, 350px);
  color: #a5b88a;
  left: -3%;
  bottom: -10%;
  font-weight: 600;
}
.tablet {
  width: 80%;
  background: #f9f7ef;
  aspect-ratio: 1.48;
  border: 10px solid #2b3028;
  border-radius: 22px;
  box-shadow: 18px 30px 35px #3b4d333d;
  transform: rotate(-7deg);
  position: relative;
  padding: 22px;
  display: grid;
  grid-template-columns: 22% 1fr;
  gap: 18px;
  z-index: 2;
}
.tablet-sidebar {
  border-right: 1px solid #dddcd0;
  font-size: 8px;
  display: flex;
  flex-direction: column;
  gap: 17px;
  color: #777f6b;
}
.tablet-sidebar strong {
  font-size: 21px;
  color: #304d38;
  letter-spacing: -1px;
  margin-bottom: 18px;
}
.tablet-sidebar .active {
  color: #304d38;
  font-weight: bold;
}
.tablet-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.tablet-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.tablet-title strong {
  font-size: 18px;
  letter-spacing: -0.7px;
}
.tablet-title span {
  font-size: 7px;
  background: #e4ebdc;
  border-radius: 20px;
  padding: 6px 9px;
}
.timetable {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.timetable > span {
  font-size: 6px;
  color: #818574;
  padding: 4px;
}
.lesson {
  min-height: 43px;
  border-radius: 4px;
  background: #e7e9cd;
  font-size: 7px;
  padding: 8px;
  line-height: 1.6;
}
.lesson:nth-of-type(3n) {
  background: #e8dacb;
}
.lesson:nth-of-type(4n) {
  background: #dce6e8;
}
.lesson:nth-of-type(7n) {
  background: #ded9e9;
}
.lesson small {
  display: block;
  opacity: 0.55;
  font-size: 6px;
}
.tablet-foot {
  font-size: 7px;
  color: #6d7761;
  display: flex;
  justify-content: space-between;
  margin-top: 17px;
}
.small-sticker {
  position: absolute;
  z-index: 4;
  right: 6%;
  top: 11%;
  width: 91px;
  height: 91px;
  border-radius: 50%;
  background: #f3f2c6;
  color: #304d38;
  font-family: var(--serif);
  font-size: 28px;
  line-height: 0.9;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  transform: rotate(13deg);
}
:root {
  --paper: #f0eee8;
  --ink: #252621;
  --orange: #f04c24;
  --line: #cfcec6;
  --muted: #68695f;
  --gutter: clamp(22px, 4vw, 80px);
  --sans: "Space Grotesk", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
}
* {
  box-sizing: border-box;
}
html {
  scroll-padding-top: 100px;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 500 16px var(--sans);
  -webkit-font-smoothing: antialiased;
}
::selection {
  background: var(--orange);
  color: var(--paper);
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
}
a,
button {
  -webkit-tap-highlight-color: transparent;
}
a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 6px;
}
h1,
h2,
h3,
p {
  margin: 0;
  font-weight: 500;
}
em {
  font-family: var(--serif);
  font-weight: 400;
}
main {
  overflow: clip;
}
.shell {
  padding-inline: var(--gutter);
}
.eyebrow {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  line-height: 1.6;
}
.section-label {
  display: flex;
  justify-content: space-between;
  gap: 25px;
  border-top: 1px solid var(--line);
  padding-top: 18px;
}
.skip {
  position: fixed;
  top: -70px;
  left: 20px;
  background: var(--ink);
  color: var(--paper);
  padding: 15px;
  z-index: 400;
}
.skip:focus {
  top: 15px;
}
.progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: var(--orange);
  transform: scaleX(0);
  transform-origin: left;
  z-index: 150;
}
.site-header {
  height: 92px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 30;
  background: var(--paper);
}
.wordmark {
  font-size: 30px;
  letter-spacing: -2px;
  display: inline-flex;
  gap: 8px;
  align-items: center;
}
.brand-star {
  color: var(--orange);
  font-size: 36px;
  display: inline-block;
}
.site-header nav {
  display: flex;
  gap: 34px;
  font-size: 12px;
}
.site-header nav a {
  padding: 12px 0;
  position: relative;
}
.site-header nav a::after {
  content: "";
  height: 1px;
  background: currentColor;
  position: absolute;
  bottom: 4px;
  left: 0;
  right: 0;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
}
.site-header nav a:hover::after,
.site-header nav a[aria-current]::after {
  transform: scaleX(1);
}
sup {
  font-size: 8px;
}
.text-link {
  display: inline-flex;
  justify-content: space-between;
  gap: 35px;
  font-size: 12px;
  border-bottom: 1px solid;
  padding-bottom: 9px;
}
.text-link:hover {
  color: var(--orange);
}
.hero {
  height: calc(100svh - 92px);
  min-height: 650px;
  max-height: 1100px;
  position: relative;
  display: flex;
  flex-direction: column;
  padding-top: 25px;
}
.hero-top {
  display: flex;
  justify-content: space-between;
}
.hero-title {
  font-size: clamp(70px, 9.4vw, 190px);
  line-height: 0.99;
  letter-spacing: -0.075em;
  margin-top: 8vh;
  position: relative;
  z-index: 3;
  pointer-events: none;
  width: max-content;
}
.line {
  display: block;
}
.hero-title .line > span {
  display: block;
}
.hero-title em {
  color: var(--orange);
  font-size: 1.15em;
}
.second-line {
  padding-left: 7vw;
}
.sculpture-wrap {
  width: 38vw;
  max-width: 780px;
  aspect-ratio: 1;
  position: absolute;
  right: -4vw;
  top: 8%;
  z-index: 2;
  pointer-events: none;
}
.sculpture {
  width: 100%;
  height: 100%;
  display: block;
}
.sculpture-wrap::after {
  content: "";
  position: absolute;
  bottom: 9%;
  left: 25%;
  width: 50%;
  height: 5%;
  border-radius: 50%;
  background: #754a26;
  filter: blur(22px);
  opacity: 0.13;
  z-index: -1;
}
.hero-bottom {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: end;
  padding-block: 30px;
  z-index: 3;
}
.hero-bottom p {
  max-width: 320px;
  font-size: 14px;
  line-height: 1.65;
}
.scroll-cue {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 11px;
}
.circle {
  height: 56px;
  width: 56px;
  border: 1px solid;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 24px;
  transition:
    background 0.3s,
    color 0.3s;
}
.scroll-cue:hover .circle {
  background: var(--ink);
  color: var(--paper);
}
.hero-rule {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-block: 18px;
  gap: 20px;
}
.hero-meter {
  width: 20%;
  height: 1px;
  background: var(--line);
}
.hero-meter i {
  display: block;
  width: 100%;
  height: 2px;
  transform: scaleX(0);
  transform-origin: left;
  background: var(--orange);
}
.hero-chapter {
  display: none;
  position: absolute;
  left: var(--gutter);
  bottom: 17%;
  z-index: 4;
}
.hero-chapter p {
  font-size: clamp(65px, 8vw, 150px);
  line-height: 0.95;
  letter-spacing: -0.055em;
  margin-top: 25px;
}
.hero-chapter em {
  color: var(--orange);
}
.motion-stage {
  background: var(--ink);
  color: var(--paper);
  position: relative;
  min-height: 900px;
  padding-block: 30px 80px;
  overflow: hidden;
}
.motion-stage .section-label {
  border-color: #5a5c50;
}
.stage-title {
  font-size: clamp(65px, 10vw, 180px);
  line-height: 0.9;
  letter-spacing: -0.06em;
  margin-top: 60px;
}
.stage-title em {
  color: #dce9ad;
}
.stage-deck {
  display: flex;
  justify-content: flex-end;
  gap: 20px;
  margin-top: -90px;
  position: relative;
}
.stage-card {
  width: 29%;
  aspect-ratio: 0.84;
  padding: 28px;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  box-shadow: 0 20px 45px #0002;
}
.card-think {
  background: #d9e8b4;
  transform: rotate(-7deg);
}
.card-make {
  background: #afa0db;
  transform: rotate(3deg);
}
.card-feel {
  background: #f1845c;
  transform: rotate(10deg);
}
.stage-card h3 {
  font-size: clamp(24px, 3.2vw, 60px);
  line-height: 1;
  letter-spacing: -0.045em;
  z-index: 2;
}
.stage-card h3 em {
  font-size: 1.12em;
}
.thinking-rings {
  position: absolute;
  left: 17%;
  top: 23%;
  width: 65%;
  aspect-ratio: 1;
}
.thinking-rings i {
  position: absolute;
  inset: 0;
  border: 1px solid #556044;
  border-radius: 50%;
}
.thinking-rings i:nth-child(2) {
  transform: scaleX(0.7);
}
.thinking-rings i:nth-child(3) {
  transform: scaleX(0.35);
}
.thinking-rings i:nth-child(4) {
  transform: scaleY(0.35);
}
.making-bars {
  position: absolute;
  inset: 25% 15% 33%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8%;
}
.making-bars i {
  width: 12%;
  height: 90%;
  background: #554474;
  border-radius: 100px;
}
.making-bars i:nth-child(2n) {
  height: 55%;
}
.making-bars i:nth-child(3) {
  height: 110%;
}
.feeling-star {
  position: absolute;
  top: 10%;
  left: 18%;
  font-size: clamp(100px, 17vw, 280px);
  color: #8f361d;
  line-height: 1.2;
}
.stage-final {
  margin-top: 100px;
  position: relative;
}
.stage-final p {
  font-size: clamp(65px, 10vw, 170px);
  line-height: 0.95;
  letter-spacing: -0.055em;
  margin-block: 25px;
}
.stage-final p em {
  color: #e0edb0;
}
.stage-final > span:last-child {
  font-size: 12px;
}
.stage-progress {
  height: 2px;
  background: #55574c;
  position: absolute;
  bottom: 30px;
  left: var(--gutter);
  right: var(--gutter);
}
.stage-progress i {
  display: block;
  height: 100%;
  background: #e0edb0;
  transform: scaleX(0);
  transform-origin: left;
}
.work {
  padding-block: 85px 90px;
}
.work-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  padding-block: 65px 50px;
  gap: 40px;
}
.work-heading h2 {
  font-size: clamp(45px, 6.5vw, 110px);
  line-height: 1;
  letter-spacing: -0.055em;
}
.work-heading p {
  font-size: 12px;
  line-height: 1.7;
}
.work-window {
  position: relative;
  overflow: hidden;
}
.project {
  display: grid;
  grid-template-columns: 1fr 2.3fr;
  gap: 5vw;
  align-items: center;
  margin-bottom: 70px;
}
.project-info h3 {
  font-size: clamp(40px, 5vw, 90px);
  letter-spacing: -0.06em;
  margin-block: 30px 20px;
}
.project-info p {
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 35px;
}
.project-frame {
  display: block;
  aspect-ratio: 1.4;
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.project-visual {
  transform: perspective(1400px);
  transform-origin: center;
  transition: filter 0.4s;
}
.gallery-controls {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  margin-top: 22px;
}
.gallery-progress {
  height: 1px;
  background: var(--line);
  width: 32%;
}
.gallery-progress i {
  display: block;
  width: 100%;
  height: 2px;
  transform: scaleX(0.333);
  transform-origin: left;
  background: var(--orange);
}
.gallery-links {
  display: flex;
  gap: 12px;
}
.gallery-links button {
  font-size: 10px;
  padding: 9px;
  border-radius: 50%;
  border: 1px solid var(--line);
}
.gallery-links button[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
}
.horizontal-work .work-rail {
  display: flex;
  width: 300%;
  will-change: transform;
}
.horizontal-work .project {
  width: 33.333333%;
  flex-shrink: 0;
  margin: 0;
  gap: 5vw;
  padding-right: 2px;
}
.horizontal-work .project-frame {
  height: min(65vh, 680px);
  aspect-ratio: auto;
}
.horizontal-work .gallery-controls {
  display: flex;
}
.home-about {
  padding-block: 110px 130px;
  border-top: 1px solid var(--line);
}
.home-about h2 {
  font-size: clamp(46px, 7vw, 125px);
  line-height: 1.1;
  letter-spacing: -0.05em;
  margin-block: 65px 40px;
}
.home-about h2 em {
  color: var(--orange);
}
.home-about-bottom {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 30px;
}
.home-about-bottom p {
  max-width: 360px;
  font-size: 14px;
  line-height: 1.7;
}
.contact-band {
  background: var(--orange);
  padding-block: 40px 70px;
}
.big-contact {
  display: block;
  position: relative;
  font-size: clamp(50px, 10vw, 180px);
  line-height: 1;
  letter-spacing: -0.06em;
  margin-top: 60px;
}
.big-contact > span {
  position: absolute;
  right: 0;
  top: 0;
  font-size: 1.1em;
  transition: transform 0.5s;
}
.big-contact:hover > span {
  transform: rotate(45deg);
}
.site-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 30px;
  padding-block: 30px;
  font-size: 10px;
}
.footer-links {
  display: flex;
  gap: 22px;
  align-items: center;
}
.footer-links button {
  font-size: 10px;
  padding: 8px 0;
}
#motion-toggle::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--orange);
  margin-right: 7px;
}
.page-intro {
  padding-top: 50px;
}
.page-intro h1,
.case-title h1 {
  font-size: clamp(65px, 10vw, 160px);
  line-height: 0.98;
  letter-spacing: -0.065em;
  margin-block: 70px 50px;
}
.page-intro h1 em {
  color: var(--orange);
}
.intro-bottom {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 30px;
  padding-bottom: 70px;
}
.intro-bottom p {
  max-width: 400px;
  font-size: 14px;
  line-height: 1.7;
}
.intro-bottom > span {
  font-size: 11px;
}
.work-index {
  padding-bottom: 110px;
}
.index-project {
  display: block;
  margin-bottom: 90px;
}
.index-project-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-top: 1px solid var(--line);
  padding-block: 25px;
}
.index-project-top h2 {
  font-size: clamp(35px, 5vw, 85px);
  letter-spacing: -0.05em;
  flex: 1;
  margin-left: 8vw;
}
.index-arrow {
  font-size: 55px;
  transition: transform 0.4s;
}
.index-project:hover .index-arrow {
  transform: rotate(45deg);
}
.index-project-art {
  height: min(72vw, 720px);
  overflow: hidden;
}
.index-project-bottom {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding-top: 18px;
  gap: 20px;
}
.index-project-art .tablet {
  max-width: 850px;
}
.case-intro {
  padding-block: 50px 60px;
}
.case-title {
  display: flex;
  gap: 40px;
  align-items: start;
  margin-top: 65px;
}
.case-title > span {
  width: 24%;
  padding-top: 20px;
  font-size: 16px;
}
.case-title h1 {
  font-size: clamp(60px, 8vw, 135px);
  margin: 0;
  flex: 1;
}
.case-title em {
  color: var(--orange);
}
.case-meta {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 8vw;
  margin-top: 55px;
  font-size: 13px;
  line-height: 1.7;
}
.case-meta > p {
  max-width: 430px;
}
.case-meta div span {
  display: block;
  font-size: 9px;
  letter-spacing: 0.09em;
  margin-bottom: 10px;
  color: var(--muted);
  text-transform: uppercase;
}
.case-cover {
  height: 85vh;
  max-height: 1000px;
  overflow: hidden;
}
.case-cover .tablet {
  width: 67%;
  max-width: 1100px;
}
.case-story,
.about-story {
  padding-block: 140px;
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 8vw;
}
.case-story h2,
.about-story h2 {
  font-size: clamp(42px, 5vw, 90px);
  letter-spacing: -0.05em;
  line-height: 1.05;
  margin-bottom: 35px;
}
.case-story p,
.about-story p {
  font-size: 16px;
  line-height: 1.8;
  margin-bottom: 22px;
  max-width: 700px;
  color: var(--muted);
}
.case-story .text-link,
.about-story .text-link {
  margin-top: 20px;
}
.case-decisions {
  padding-bottom: 100px;
}
.principles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5vw;
  margin-top: 60px;
}
.principle > span {
  font-size: 12px;
  color: var(--orange);
}
.principle h3 {
  font-size: 28px;
  letter-spacing: -0.035em;
  margin-block: 30px 18px;
}
.principle p {
  font-size: 13px;
  line-height: 1.8;
  color: var(--muted);
}
.detail-stage {
  background: #e3e1d9;
  padding-block: 40px 55px;

.pointer-ring {
  position: fixed;
  left: 0;
  top: 0;
  width: 28px;
  height: 28px;
  border: 1px solid var(--orange);
  border-radius: 50%;
  pointer-events: none;
  z-index: 100;
  opacity: 0;
}
.pointer-trail {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  color: var(--orange);
  pointer-events: none;
  z-index: 99;
  opacity: 0.3;
}
.project-cursor {
  position: fixed;
  top: 0;
  left: 0;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--orange);
  color: var(--paper);
  display: grid;
  place-content: center;
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
  pointer-events: none;
  z-index: 101;
  opacity: 0;
  transform: scale(0);
}
.page-transition {
  position: fixed;
  inset: 0;
  z-index: 300;
  pointer-events: none;
  visibility: hidden;
}
.transition-back,
.transition-front {
  position: absolute;
  inset: 0;
  transform: translateY(100%);
}
.transition-back {
  background: var(--orange);
}
.transition-front {
  background: var(--ink);
  color: var(--paper);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 25px;
}
.transition-star {
  font-size: 80px;
  color: var(--orange);
}
#transition-name {
  font-size: clamp(50px, 10vw, 140px);
  letter-spacing: -0.06em;
}
.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translate(-50%, 20px);
  opacity: 0;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid #737666;
  padding: 13px 22px;
  border-radius: 40px;
  z-index: 120;
  font-size: 12px;
  pointer-events: none;
  transition:
    opacity 0.2s,
    transform 0.2s;
}
.toast.visible {
  opacity: 1;
  transform: translate(-50%, 0);
}
.no-motion *,
.no-motion *::before,
.no-motion *::after {
  animation: none;
  transition: none;
}
.no-motion .pointer-ring,
.no-motion .pointer-trail,
.no-motion .project-cursor {
  display: none;
}
