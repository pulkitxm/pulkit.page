<footer class="border-t border-line pt-6 pb-10 text-xs text-muted">
  <div>{{ social }}</div>
  <div class="mt-4.5 flex items-center justify-between gap-4">
    <small>{{ copyright }}</small>
    <div class="flex items-center gap-4">
      <a
        class="text-inherit decoration-muted underline-offset-4 hover:decoration-current"
        href="{{ markdown }}"
        type="text/markdown"
        >View as Markdown</a
      ><button
        class="cursor-pointer rounded-md border border-line bg-transparent px-2.5 py-1.25 text-inherit [font:inherit]"
        type="button"
        data-theme-toggle
        aria-label="Switch color theme"
      >
        Theme
      </button>
    </div>
  </div>
</footer>
