<!doctype html>
<html lang="en" class="scheme-light-dark data-[theme=dark]:scheme-dark data-[theme=light]:scheme-light">
  {{ > head }}
  <body
    class="m-0 bg-bg font-sans text-base/relaxed text-fg antialiased **:box-border **:focus-visible:outline-2 **:focus-visible:outline-offset-5 **:focus-visible:outline-fg"
  >
    <a
      class="absolute -top-25 text-inherit decoration-muted underline-offset-4 hover:decoration-current focus:top-2"
      href="#main"
      >Skip to content</a
    >
    <div class="mx-auto max-w-190 px-7 max-sm:px-5.5">
      {{ > header }}
      <main id="main" class="min-h-[56vh] pt-12 pb-18 max-sm:pt-7">
        {{ breadcrumbs }}
        <article>
          <header class="mb-7">
            <h1
              class="mt-0 mb-5 w-fit text-[clamp(30px,5vw,40px)] font-semibold leading-tight tracking-tight"
              data-title
            >
              {{ heading }}
            </h1>
            {{ date }}
          </header>
          <div class="wrap-anywhere">{{ content }}</div>
        </article>
        {{ related }}
      </main>
      {{ > footer }}
    </div>
  </body>
</html>
