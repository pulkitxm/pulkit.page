<!doctype html>
<html lang="en">
  {{ > head }}
  <body class="m-0 bg-bg font-sans text-[16px]/[1.75] text-fg antialiased">
    <a class="absolute -top-25 focus:top-2" href="#main">Skip to content</a>
    <div class="mx-auto max-w-190 px-7 max-sm:px-5.5">
      {{ > header }}
      <main id="main" class="min-h-[56vh] pt-12 pb-18 max-sm:pt-7">
        {{ breadcrumbs }}
        <article>
          <header class="mb-7">
            <h1 class="mt-0 mb-5 w-fit text-[clamp(30px,5vw,40px)] font-[550]" data-title>
              {{ heading }}
            </h1>
            {{ date }}
          </header>
          <div class="wrap-anywhere">{{ content }}</div>
        </article>
        {{ related }}
      </main>
      {{ > footer }}
    </div>
  </body>
</html>
