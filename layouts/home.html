<!doctype html>
<html lang="en">
  {{ > head }}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      {{ > header }}
      <main id="main" class="home">
        {{ breadcrumbs }}
        <article>
          <h1 class="visually-hidden">{{ heading }}</h1>
          <div class="prose">{{ content }}</div>
        </article>
        {{ related }}
      </main>
      {{ > footer }}
    </div>
  </body>
</html>
