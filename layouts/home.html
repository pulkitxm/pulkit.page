<!doctype html>
<html lang="en">
  {{ > head }}
  <body class="m-0 bg-bg font-sans text-[16px]/[1.75] text-fg antialiased">
    <a class="absolute -top-25 focus:top-2" href="#main">Skip to content</a>
    <div class="mx-auto max-w-190 px-7 max-sm:px-5.5">
      {{ > header }}
      <main
        id="main"
        class="min-h-[56vh] pt-12 pb-18 max-sm:pt-7 [&_h2]:text-md [&_h2]:tracking-normal"
      >
        {{ breadcrumbs }}
        <article>
          <h1 class="sr-only">{{ heading }}</h1>
          <div class="wrap-anywhere">{{ content }}</div>
        </article>
        {{ related }}
      </main>
      {{ > footer }}
    </div>
  </body>
</html>
