<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
  @view-transition {
    navigation: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    @view-transition {
      navigation: none;
    }
  }
  </style>
  <meta name="description" content="{{description}}" />
  {{ seo }}
  <meta name="theme-color" content="#faebd7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#181916" media="(prefers-color-scheme: dark)" />
  <script src="/theme.js"></script>
  <title>{{ title }}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
